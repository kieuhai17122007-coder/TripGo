<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Tra cứu đặt vé</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="logo" href="../index.html">✈ TripGo</a>
        <nav>
          <a href="../index.html">Đặt vé</a>
          <a href="search.html">Chuyến bay</a>
          <a href="../index.html#services">Dịch vụ</a>
          <a href="booking.html">Tra cứu</a>
          <a href="checkin.html">Check-in</a>
        </nav>
      </div>
    </header>
    <main class="simple-page">
      <div class="form-card">
        <p class="eyebrow dark">MANAGE BOOKING</p>
        <h1>Tra cứu đặt chỗ</h1>
        <p>Nhập mã đặt chỗ để xem hành trình.</p>
        <label>
          Mã đặt chỗ
          <input id="code" placeholder="Ví dụ: TG123456">
        </label>
        <label>
          Email/Số điện thoại
          <input id="contact" placeholder="Nhập thông tin liên hệ">
        </label>
        <button class="primary-btn wide" onclick="lookup()">TRA CỨU</button>
        <div id="result"></div>
      </div>
    </main>
    <script>
      function lookup() {
        const c = document.getElementById('code').value.trim();
        document.getElementById('result').innerHTML = c ? '<div class="notice">Đang mô phỏng tra cứu mã <b>' + c + '</b>. Dữ liệu được lưu bằng LocalStorage.</div>' : '<div class="error">Vui lòng nhập mã đặt chỗ.</div>';
      }
    </script>
  </body>
</html>
