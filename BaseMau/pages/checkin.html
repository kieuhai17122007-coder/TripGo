<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Check-in</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="logo" href="../index.html">✈ TripGo</a>
        <nav>
          <a href="../index.html">Đặt vé</a>
          <a href="search.html">Chuyến bay</a>
          <a href="../index.html#services">Dịch vụ</a>
          <a href="booking.html">Tra cứu</a>
          <a href="checkin.html">Check-in</a>
        </nav>
      </div>
    </header>
    <main class="simple-page">
      <div class="form-card">
        <p class="eyebrow dark">ONLINE CHECK-IN</p>
        <h1>Check-in trực tuyến</h1>
        <p>Nhập mã đặt chỗ và họ để bắt đầu.</p>
        <label>
          Mã đặt chỗ
          <input placeholder="TG123456">
        </label>
        <label>
          Họ hành khách
          <input placeholder="NGUYEN">
        </label>
        <button class="primary-btn wide" onclick="checkin()">CHECK-IN</button>
        <div id="result"></div>
      </div>
    </main>
    <script>
      function checkin() {
        document.getElementById('result').innerHTML = '<div class="notice">Check-in mô phỏng thành công. Bước tiếp theo: chọn ghế.</div>';
      }
    </script>
  </body>
</html>
