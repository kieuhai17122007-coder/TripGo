<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripGo - Xác nhận thông tin</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    .confirm-section {
      margin-bottom: 20px;
    }

    .confirm-section h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .confirm-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .confirm-label {
      color: #666;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .back-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
    }

    .primary-btn {
      flex: 1;
    }
  </style>
</head>

<body>

<main class="simple-page">

  <div class="form-card">

    <p class="eyebrow dark">CONFIRM BOOKING</p>

    <h1>Xác nhận thông tin</h1>

    <div class="confirm-section">
      <h2>Thông tin hành khách</h2>

      <div class="confirm-row">
        <span class="confirm-label">Họ và tên</span>
        <span id="name">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Email</span>
        <span id="email">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Số điện thoại</span>
        <span id="phone">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">CCCD/Hộ chiếu</span>
        <span id="document">---</span>
      </div>
    </div>

    <div class="confirm-section">
      <h2>Thông tin chuyến bay</h2>

      <div class="confirm-row">
        <span class="confirm-label">Điểm đi</span>
        <span id="from">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Điểm đến</span>
        <span id="to">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Ngày bay</span>
        <span id="date">---</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Ghế</span>
        <span id="seat">---</span>
      </div>
    </div>

    <div class="confirm-section">
      <h2>Thanh toán</h2>

      <div class="confirm-row">
        <span class="confirm-label">Giá vé</span>
        <span id="price">0 VNĐ</span>
      </div>

      <div class="confirm-row">
        <span class="confirm-label">Phụ thu</span>
        <span id="fee">0 VNĐ</span>
      </div>

      <div class="confirm-row total">
        <span>Tổng tiền</span>
        <span id="total">0 VNĐ</span>
      </div>
    </div>

    <div class="button-group">
      <button class="back-btn" onclick="goBack()">
        QUAY LẠI
      </button>

      <button class="primary-btn" onclick="confirmBooking()">
        XÁC NHẬN ĐẶT VÉ
      </button>
    </div>
  </div>
</main>

<script>
  const passenger = JSON.parse(
    localStorage.getItem('tripgo_passenger')
  );

  if (passenger) {
    document.getElementById('name').textContent = passenger.name || '---';
    document.getElementById('email').textContent = passenger.email || '---';
    document.getElementById('phone').textContent = passenger.phone || '---';
    document.getElementById('document').textContent = passenger.document || '---';
  }

  const booking = JSON.parse(
    localStorage.getItem('tripgo_booking')
  );

  if (booking) {
    document.getElementById('from').textContent = booking.from || '---';
    document.getElementById('to').textContent = booking.to || '---';
    document.getElementById('date').textContent = booking.date || '---';
    document.getElementById('seat').textContent = booking.seat || '---';

    document.getElementById('price').textContent =
      (booking.price || 0).toLocaleString('vi-VN') + ' VNĐ';

    document.getElementById('fee').textContent =
      (booking.fee || 0).toLocaleString('vi-VN') + ' VNĐ';

    document.getElementById('total').textContent =
      ((booking.price || 0) + (booking.fee || 0))
      .toLocaleString('vi-VN') + ' VNĐ';
  }

  function goBack() {
    location.href = 'seat.html';
  }

  function confirmBooking() {
    location.href = 'payment.html';
  }
</script>

</body>
</html>
