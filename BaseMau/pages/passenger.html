<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Hành khách</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
  </head>
  <body>
    <main class="simple-page">
      <div class="form-card">
        <p class="eyebrow dark">BOOKING</p>
        <h1>Thông tin hành khách</h1>
        <label>
          Họ và tên
          <input id="name" placeholder="NGUYEN VAN A">
        </label>
        <label>
          Email
          <input id="email" type="email" placeholder="email@example.com">
        </label>
        <label>
          Số điện thoại
          <input id="phone" placeholder="09xxxxxxxx">
        </label>
        <label>
          Số CCCD/Hộ chiếu
          <input id="document" placeholder="Nhập số giấy tờ">
        </label>
        <button class="primary-btn wide" onclick="next()">TIẾP TỤC CHỌN GHẾ</button>
      </div>
    </main>
    <script>
      function next() {
        const data = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          document: document.getElementById('document').value
        };
        localStorage.setItem('tripgo_passenger', JSON.stringify(data));
        location.href = 'seat.html';
      }
    </script>
  </body>
</html>
