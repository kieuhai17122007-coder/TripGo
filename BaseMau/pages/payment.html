<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Thanh toán</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
  </head>
  <body>
    <main class="simple-page">
      <div class="form-card">
        <p class="eyebrow dark">PAYMENT</p>
        <h1>Thanh toán</h1>
        <div id="summary" class="notice"></div>
        <label>
          Phương thức thanh toán
          <select id="method">
            <option>Thẻ nội địa</option>
            <option>Thẻ quốc tế</option>
            <option>Ví điện tử</option>
          </select>
        </label>
        <button class="primary-btn wide" onclick="pay()">THANH TOÁN</button>
        <div id="result"></div>
      </div>
    </main>
    <script>
      const f = JSON.parse(localStorage.getItem('tripgo_selected_flight') || 'null');
      const s = localStorage.getItem('tripgo_selected_seat') || '-';
      document.getElementById('summary').innerHTML = f ? `Chuyến <b>${f.id}</b> · ${f.departure} - ${f.arrival}<br>Ghế: <b>${s}</b><br>Tổng tiền: <b>${f.price.toLocaleString('vi-VN')} ₫</b>` : 'Chưa có chuyến bay';

      function pay() {
        const code = 'TG' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('tripgo_booking', JSON.stringify({ code, flight: f, seat: s }));
        document.getElementById('result').innerHTML = `<div class="notice">Đặt vé thành công. Mã đặt chỗ: <b>${code}</b><br><a href="booking.html">Tra cứu đặt chỗ →</a></div>`;
      }
    </script>
  </body>
</html>
