<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Chọn ghế</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head>
<body><main class="simple-page"><div class="form-card"><p class="eyebrow dark">SEAT SELECTION</p><h1>Chọn ghế</h1><div id="seats" class="seats"></div><button class="primary-btn wide" onclick="next()">TIẾP TỤC THANH TOÁN</button></div></main><script>const box=document.getElementById('seats');let selected='';for(let r=1;r<=8;r++){for(let c of ['A','B','C','D','E','F']){const b=document.createElement('button');b.className='seat';b.textContent=r+c;b.onclick=()=>{document.querySelectorAll('.seat').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=r+c};box.appendChild(b)}}function next(){if(!selected)return alert('Hãy chọn ghế');localStorage.setItem('tripgo_selected_seat',selected);location.href='payment.html'}</script></body></html>
