<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripGo - Tra cứu đặt vé</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="../index.html">✈ TripGo</a>
  <nav>
    <a href="../index.html">Đặt vé</a>
    <a href="search.html">Chuyến bay</a>
    <a href="../index.html#services">Dịch vụ</a>
    <a href="booking.html">Tra cứu</a>
    <a href="checkin.html">Check-in</a>
  </nav>
</div>
  </header>
  <main class="simple-page">
    <div class="form-card">
  <p class="eyebrow dark">MANAGE BOOKING</p>
  <h1>Tra cứu đặt chỗ</h1>
  <p>
    Nhập mã đặt chỗ và Email/Số điện thoại để xem thông tin vé.
  </p>
  <label>
    Mã đặt chỗ
    <input
      id="code"
      type="text"
      placeholder="Ví dụ: TG123456"
    >
  </label>
  <label>
    Email/Số điện thoại
    <input
      id="contact"
      type="text"
      placeholder="Nhập Email hoặc số điện thoại"
    >
  </label>
  <button class="primary-btn wide" onclick="lookup()">
    TRA CỨU
  </button>
  <div id="result"></div>
</div>
  </main>
  <script>
    function lookup() {
      const code = document.getElementById("code").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const result = document.getElementById("result");
      if (!code) {
        result.innerHTML =
          '<div class="error">Vui lòng nhập mã đặt chỗ.</div>';
        return;
      }
      if (!contact) {
        result.innerHTML =
          '<div class="error">Vui lòng nhập Email hoặc số điện thoại.</div>';
        return;
      }
      const bookingData = JSON.parse(
        localStorage.getItem("tripgo_booking")
      );
      if (!bookingData) {
        result.innerHTML =
          '<div class="error">Không tìm thấy thông tin đặt vé.</div>';
        return;
      }
      const savedCode = bookingData.bookingCode || "";
      const savedEmail = bookingData.passenger?.email || "";
      const savedPhone = bookingData.passenger?.phone || "";
      const codeMatch =
        code.toUpperCase() === savedCode.toUpperCase();
      const contactMatch =
        contact.toLowerCase() === savedEmail.toLowerCase() ||
        contact === savedPhone;
      if (!codeMatch || !contactMatch) {
        result.innerHTML =
          '<div class="error">Mã đặt chỗ hoặc thông tin liên hệ không chính xác.</div>';
        return;
      }

      result.innerHTML = `
        <div class="notice">
          <h3>Thông tin đặt vé</h3>
          <p>
            <b>Mã đặt chỗ:</b>
            ${bookingData.bookingCode || "N/A"}
          </p>
          <p>
            <b>Hành khách:</b>
            ${bookingData.passenger?.fullName || "N/A"}
          </p>
          <p>
            <b>Email:</b>
            ${bookingData.passenger?.email || "N/A"}
          </p>
          <p>
            <b>Số điện thoại:</b>
            ${bookingData.passenger?.phone || "N/A"}
          </p>
          <p>
            <b>Chuyến bay:</b>
            ${bookingData.flight?.flightNumber || "N/A"}
          </p>
          <p>
            <b>Hành trình:</b>
            ${bookingData.flight?.from || "N/A"}
            →
            ${bookingData.flight?.to || "N/A"}
          </p>
          <p>
            <b>Ghế:</b>
            ${bookingData.seat || "Chưa chọn"}
          </p>
          <p>
            <b>Loại vé:</b>
            ${bookingData.ticketType || "N/A"}
          </p>
          <p>
            <b>Hành lý:</b>
            ${bookingData.baggage || "Không có"}
          </p>
          <p>
            <b>Tổng tiền:</b>
            ${formatPrice(bookingData.totalPrice)}
          </p>
          <p>
            <b>Trạng thái:</b>
            <span>Đã đặt vé</span>
          </p>
        </div>
      `;
    }
    function formatPrice(price) {
      if (!price) {
        return "0 VNĐ";
      }
      return Number(price).toLocaleString("vi-VN") + " VNĐ";
    }
  </script>
</body>
</html>
