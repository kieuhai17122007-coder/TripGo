<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Tra cứu vé</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">✈ TripGo</a><nav><a href="../index.html">Đặt vé</a><a href="search.html">Chuyến bay</a><a href="booking.html">Tra cứu</a><a href="checkin.html">Check-in</a><a href="my-bookings.html">Vé của tôi</a></nav><a class="login-btn" href="login.html">Tài khoản</a></div></header><main class="simple-page"><div class="form-card"><p class="eyebrow dark">MANAGE BOOKING</p><h1>Tra cứu đặt chỗ</h1><p>Tra cứu bằng mã đặt vé và email hoặc số điện thoại.</p><label>Mã đặt vé<input id="code" placeholder="TG123456789"></label><label>Email/Số điện thoại<input id="contact" placeholder="email@example.com hoặc 09xxxxxxxx"></label><button class="primary-btn wide" id="lookupBtn">TRA CỨU</button><div id="result"></div></div></main><script src="../js/app.js"></script><script>
const q=getQuery();if(q.code)document.getElementById('code').value=q.code;
function lookup(){const code=document.getElementById('code').value.trim().toUpperCase(),contact=document.getElementById('contact').value.trim().toLowerCase(),r=document.getElementById('result');if(!code||!contact){r.innerHTML='<div class="error">Vui lòng nhập đầy đủ thông tin.</div>';return;}const b=getBookings().find(x=>x.code.toUpperCase()===code&&(String(x.contact).toLowerCase()===contact||String(x.contactPhone).toLowerCase()===contact));if(!b){r.innerHTML='<div class="error">Không tìm thấy vé phù hợp.</div>';return;}render(b);}
function render(b){const c=b.status==='cancelled';document.getElementById('result').innerHTML=`<div class="booking-result"><div class="booking-head"><strong>${escapeHTML(b.code)}</strong><span class="status ${c?'cancelled':'confirmed'}">${statusLabel(b.status)}</span></div><div class="review-route"><b>${AIRPORTS[b.flight.from]}</b><span>✈ ${b.flight.departure} - ${b.flight.arrival} ✈</span><b>${AIRPORTS[b.flight.to]}</b></div><p><b>Ngày bay:</b> ${dateVN(b.departureDate||b.flight.date)}</p><p><b>Hành khách:</b> ${escapeHTML(b.passenger.name)}${b.passengers?.length>1?` và ${b.passengers.length-1} người khác`:''}</p><p><b>Ghế:</b> ${escapeHTML(b.seat)} · <b>Hạng:</b> ${escapeHTML(b.fareClass||'Phổ thông')}</p><p><b>Thanh toán:</b> ${escapeHTML(b.paymentMethod)} · <b>Tổng:</b> ${formatMoney(b.total)}</p>${!c?`<button class="danger-btn" onclick="cancelBooking('${escapeHTML(b.code)}')">HỦY VÉ</button>`:''}</div>`;}
function cancelBooking(code){if(!confirm(`Xác nhận hủy vé ${code}?`))return;const bs=getBookings(),i=bs.findIndex(x=>x.code===code);if(i<0)return;bs[i].status='cancelled';bs[i].cancelledAt=new Date().toISOString();saveBookings(bs);render(bs[i]);}
document.getElementById('lookupBtn').onclick=lookup;
</script></body></html>
