<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Check-in</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">✈ TripGo</a><nav><a href="../index.html">Đặt vé</a><a href="search.html">Chuyến bay</a><a href="booking.html">Tra cứu</a><a href="checkin.html">Check-in</a><a href="my-bookings.html">Vé của tôi</a></nav><a class="login-btn" href="login.html">Tài khoản</a></div></header><main class="simple-page"><div class="form-card"><p class="eyebrow dark">ONLINE CHECK-IN</p><h1>Check-in trực tuyến</h1><p>Nhập mã đặt chỗ và họ hành khách.</p><label>Mã đặt chỗ<input id="code" placeholder="TG123456789"></label><label>Họ hành khách<input id="surname" placeholder="NGUYEN"></label><button class="primary-btn wide" id="btn">CHECK-IN</button><div id="result"></div></div></main><script src="../js/app.js"></script><script>document.getElementById('btn').onclick=()=>{const code=codeEl.value.trim().toUpperCase(),surname=surnameEl.value.trim().toLowerCase();};const codeEl=document.getElementById('code'),surnameEl=document.getElementById('surname');document.getElementById('btn').onclick=()=>{const c=codeEl.value.trim().toUpperCase(),s=surnameEl.value.trim().toLowerCase(),r=document.getElementById('result');const b=getBookings().find(x=>x.code===c);if(!b){r.innerHTML='<div class="error">Không tìm thấy mã đặt chỗ.</div>';return;}if(b.status==='cancelled'){r.innerHTML='<div class="error">Vé đã bị hủy, không thể check-in.</div>';return;}const last=(b.passenger.name||'').trim().split(/\s+/).pop().toLowerCase();if(last!==s){r.innerHTML='<div class="error">Họ hành khách không khớp.</div>';return;}r.innerHTML=`<div class="notice">Check-in mô phỏng thành công cho <b>${escapeHTML(b.passenger.name)}</b> · ${escapeHTML(b.flight.id)} · ghế ${escapeHTML(b.seat)}.<br>Thời gian check-in: ${new Date().toLocaleString('vi-VN')}.</div>`;};</script></body></html>
