<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Xác nhận đặt vé</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card wide-card"><div class="stepper"><span>1 Hành khách</span><span>2 Chọn ghế</span><span class="active">3 Xác nhận</span><span>4 Thanh toán</span></div><p class="eyebrow dark">BOOKING REVIEW</p><h1>Xác nhận thông tin</h1><div id="summary"></div><div class="confirm-check"><label><input type="checkbox" id="agree"> Tôi xác nhận các thông tin trên là chính xác.</label></div><div id="result"></div><button class="primary-btn wide" id="continue">TIẾP TỤC THANH TOÁN</button><p class="back"><a href="seat.html">← Quay lại</a></p></div></main><script src="../js/app.js"></script><script>
const f=read(TG.SELECTED,null),p=read(TG.PASSENGERS,null),seat=read(TG.SEAT,'-'),fare=read(TG.FARE,{type:'economy',multiplier:1,className:'Phổ thông',baggage:f?.baggage||7}),q=read(TG.SEARCH,{}),box=document.getElementById('summary');
if(!f||!p){box.innerHTML='<div class="error">Chưa đủ dữ liệu đặt vé.</div>';document.getElementById('continue').disabled=true;}else{const base=Number(f.price)*Number(fare.multiplier||1)*p.count*(q.tripType==='roundtrip'?2:1); write(TG.DRAFT,{...read(TG.DRAFT,{}),total:base}); box.innerHTML=`<div class="review-card"><div class="review-route"><b>${AIRPORTS[f.from]} (${f.from})</b><span>✈ ${f.departure} - ${f.arrival} ✈</span><b>${AIRPORTS[f.to]} (${f.to})</b></div><div class="detail-list"><div><span>Chuyến bay</span><b>${escapeHTML(f.id)} · ${escapeHTML(f.airline)}</b></div><div><span>Ngày đi</span><b>${dateVN(q.departure||f.date)}</b></div><div><span>Hành khách</span><b>${p.count}</b></div><div><span>Ghế</span><b>${escapeHTML(seat)}</b></div><div><span>Hạng vé</span><b>${escapeHTML(fare.className)}</b></div><div><span>Hành lý</span><b>${fare.baggage} kg/người</b></div><div><span>Liên hệ</span><b>${escapeHTML(p.contact.email)} · ${escapeHTML(p.contact.phone)}</b></div><div class="total-row"><span>Tạm tính</span><strong>${formatMoney(base)}</strong></div></div><h3>Hành khách</h3>${p.passengers.map((x,i)=>`<div class="passenger-mini"><b>${i+1}. ${escapeHTML(x.name)}</b><span>${escapeHTML(x.gender)} · ${dateVN(x.birth)} · ${escapeHTML(x.document)}</span></div>`).join('')}</div>`;}
document.getElementById('continue').onclick=()=>{if(!document.getElementById('agree').checked){document.getElementById('result').innerHTML='<div class="error">Bạn cần xác nhận thông tin trước khi tiếp tục.</div>';return;}location.href='payment.html';};
</script></body></html>
