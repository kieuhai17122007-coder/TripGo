<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Chi tiết chuyến bay</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">✈ TripGo</a><nav><a href="../index.html">Đặt vé</a><a href="search.html">Chuyến bay</a><a href="booking.html">Tra cứu</a><a href="my-bookings.html">Vé của tôi</a></nav><a class="login-btn" href="login.html">Tài khoản</a></div></header><main class="page"><div class="container"><div class="page-title"><p class="eyebrow dark">FLIGHT DETAIL</p><h1>Chi tiết chuyến bay</h1></div><div id="detail"></div></div></main><script src="../js/app.js"></script><script>
const f=read(TG.SELECTED,null), q=read(TG.SEARCH,{}); const box=document.getElementById('detail');
if(!f){box.innerHTML='<div class="notice">Chưa có chuyến bay được chọn. <a href="search.html">Quay lại danh sách</a></div>';}else{
 box.innerHTML=`<div class="detail-grid"><section class="detail-card"><div class="booking-head"><div><span class="eyebrow dark">${escapeHTML(f.airline)}</span><h2>${escapeHTML(f.from)} → ${escapeHTML(f.to)}</h2></div><b class="price">${formatMoney(f.price)}</b></div><div class="route-large"><div><strong>${f.departure}</strong><span>${AIRPORTS[f.from]} (${f.from})</span></div><div><small>${escapeHTML(f.duration)}</small><i>✈</i></div><div><strong>${f.arrival}</strong><span>${AIRPORTS[f.to]} (${f.to})</span></div></div><div class="detail-list"><div><span>Ngày bay</span><b>${dateVN(q.departure||f.date)}</b></div><div><span>Máy bay</span><b>${escapeHTML(f.aircraft)}</b></div><div><span>Hành lý cơ bản</span><b>${f.baggage||7} kg</b></div></div></section><section class="detail-card"><h2>Chọn hạng và loại vé</h2><label class="choice"><input type="radio" name="fare" value="economy" checked><span><b>Phổ thông tiêu chuẩn</b><small>Đổi vé có phí · ${f.baggage||7}kg hành lý</small></span><strong>${formatMoney(f.price)}</strong></label><label class="choice"><input type="radio" name="fare" value="flex"><span><b>Phổ thông linh hoạt</b><small>Ưu tiên đổi vé · ${Number(f.baggage||7)+10}kg hành lý</small></span><strong>${formatMoney(f.price*1.2)}</strong></label><label class="choice"><input type="radio" name="fare" value="business"><span><b>Thương gia</b><small>Ưu tiên check-in · ${Number(f.baggage||7)+20}kg hành lý</small></span><strong>${formatMoney(f.price*1.8)}</strong></label><button class="primary-btn wide" id="continue">TIẾP TỤC NHẬP HÀNH KHÁCH</button></section></div>`;
 document.getElementById('continue').onclick=()=>{const type=document.querySelector('input[name=fare]:checked').value; const multipliers={economy:1,flex:1.2,business:1.8}; const baggage={economy:f.baggage||7,flex:Number(f.baggage||7)+10,business:Number(f.baggage||7)+20}; write(TG.FARE,{type,multiplier:multipliers[type],baggage:baggage[type],className:type==='business'?'Thương gia':type==='flex'?'Phổ thông linh hoạt':'Phổ thông'}); location.href='passenger.html';};
}
</script></body></html>
