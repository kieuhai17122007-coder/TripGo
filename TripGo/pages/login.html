<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Đăng nhập</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card"><a class="logo" href="../index.html">✈ TripGo</a><p class="eyebrow dark">ACCOUNT</p><h1>Đăng nhập</h1><form id="form"><label>Email<input id="email" type="email" required></label><label>Mật khẩu<input id="password" type="password" required></label><div id="result"></div><button class="primary-btn wide">ĐĂNG NHẬP</button></form><p class="back"><a href="register.html">Chưa có tài khoản? Đăng ký</a></p><div class="notice"><b>Admin demo:</b> admin@tripgo.vn / admin123</div></div></main><script src="../js/app.js"></script><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value,r=document.getElementById('result'),u=getUsers().find(x=>x.email===email&&x.password===pw);if(!u){r.innerHTML='<div class="error">Email hoặc mật khẩu không chính xác.</div>';return;}setSession(u);const next=getQuery().next;location.href=u.role==='admin'?'admin.html':(next||'profile.html');};</script></body></html>
