<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Đăng nhập</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
  </head>
  <body>
    <main class="simple-page">
      <div class="form-card">
        <a class="logo" href="../index.html">✈ TripGo</a>
        <h1>Đăng nhập</h1>
        <label>
          Email
          <input type="email" id="email" placeholder="email@example.com">
        </label>
        <label>
          Mật khẩu
          <input type="password" placeholder="••••••••">
        </label>
        <button class="primary-btn wide" onclick="login()">ĐĂNG NHẬP</button>
        <div id="result"></div>
        <p class="back">
          <a href="../index.html">← Về trang chủ</a>
        </p>
      </div>
    </main>
    <script>
      function login() {
        const email = document.getElementById('email').value;
        localStorage.setItem('tripgo_user', email);
        document.getElementById('result').innerHTML = '<div class="notice">Đăng nhập mô phỏng thành công.</div>';
      }
    </script>
  </body>
</html>
