<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Vé của tôi</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">✈ TripGo</a><nav><a href="../index.html">Đặt vé</a><a href="search.html">Chuyến bay</a><a href="booking.html">Tra cứu</a><a href="my-bookings.html">Vé của tôi</a><a href="profile.html">Tài khoản</a></nav><button class="login-btn" onclick="logout()">Đăng xuất</button></div></header><main class="page"><div class="container"><div class="page-title"><p class="eyebrow dark">MY BOOKINGS</p><h1>Danh sách vé của tôi</h1><p id="userText"></p></div><div class="booking-filter"><button class="filter-tab active" data-filter="all">Tất cả</button><button class="filter-tab" data-filter="confirmed">Đã xác nhận</button><button class="filter-tab" data-filter="cancelled">Đã hủy</button></div><div id="bookingList"></div></div></main><script src="../js/app.js"></script><script>if(requireLogin()){const u=getCurrentUser();userText.textContent=u.email;const all=getBookings().filter(b=>b.userId===u.id);function render(filter='all'){const bs=filter==='all'?all:all.filter(b=>b.status===filter);bookingList.innerHTML=bs.length?bs.slice().reverse().map(b=>`<article class="booking-card"><div><div class="booking-head"><strong>${escapeHTML(b.code)}</strong><span class="status ${b.status==='cancelled'?'cancelled':'confirmed'}">${statusLabel(b.status)}</span></div><h3>${AIRPORTS[b.flight.from]} → ${AIRPORTS[b.flight.to]}</h3><p>${dateVN(b.departureDate)} · ${b.flight.departure} - ${b.flight.arrival} · Ghế ${escapeHTML(b.seat)}</p><p>${escapeHTML(b.passenger.name)} · ${escapeHTML(b.fareClass||'Phổ thông')}</p></div><div class="booking-price">${formatMoney(b.total)}</div></article>`).join(''):'<div class="notice">Không có vé trong mục này.</div>';}render();document.querySelectorAll('.filter-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(btn.dataset.filter);});}</script></body></html>
