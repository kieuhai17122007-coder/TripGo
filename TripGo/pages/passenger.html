<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Hành khách</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card wide-card"><div class="stepper"><span class="active">1 Hành khách</span><span>2 Chọn ghế</span><span>3 Xác nhận</span><span>4 Thanh toán</span></div><p class="eyebrow dark">PASSENGER INFORMATION</p><h1>Thông tin hành khách</h1><p id="flightSummary"></p><div class="passenger-toolbar"><b id="countText">1 hành khách</b><button class="secondary-btn" id="addPassenger">+ Thêm hành khách</button></div><form id="passengerForm"><div id="passengerList"></div><div class="contact-card"><h3>Thông tin người đặt vé</h3><div class="form-grid"><label>Email<input id="contactEmail" type="email" required placeholder="email@example.com"></label><label>Số điện thoại<input id="contactPhone" required placeholder="09xxxxxxxx"></label></div></div><div id="result"></div><button class="primary-btn wide" type="submit">TIẾP TỤC CHỌN GHẾ</button></form></div></main><script src="../js/app.js"></script><script>
const f=read(TG.SELECTED,null), q=read(TG.SEARCH,{passengers:1}), existing=read(TG.PASSENGERS,[]); let count=Math.max(1,Math.min(9,Number(q.passengers||1))); const list=document.getElementById('passengerList');
if(!f) {document.getElementById('result').innerHTML='<div class="error">Chưa chọn chuyến bay.</div>';} else document.getElementById('flightSummary').textContent=`${AIRPORTS[f.from]} (${f.from}) → ${AIRPORTS[f.to]} (${f.to}) · ${f.departure} - ${f.arrival}`;
function renderPassengers(){ document.getElementById('countText').textContent=`${count} hành khách`; list.innerHTML=Array.from({length:count},(_,i)=>{const p=existing[i]||{};return `<div class="passenger-block"><h3>Hành khách ${i+1}</h3><div class="form-grid"><label>Họ và tên<input name="name" data-i="${i}" value="${escapeHTML(p.name||'')}" placeholder="NGUYỄN VĂN A" required></label><label>Giới tính<select name="gender" data-i="${i}"><option value="Nam" ${p.gender==='Nam'?'selected':''}>Nam</option><option value="Nữ" ${p.gender==='Nữ'?'selected':''}>Nữ</option><option value="Khác" ${p.gender==='Khác'?'selected':''}>Khác</option></select></label><label>Ngày sinh<input type="date" name="birth" data-i="${i}" value="${p.birth||''}" required></label><label>CCCD/Hộ chiếu<input name="document" data-i="${i}" value="${escapeHTML(p.document||'')}" minlength="6" required placeholder="Số giấy tờ"></label></div></div>`}).join('');}
renderPassengers(); document.getElementById('addPassenger').onclick=()=>{if(count<9){count++;renderPassengers();}};
document.getElementById('passengerForm').onsubmit=e=>{e.preventDefault(); const result=document.getElementById('result'); const fd=new FormData(e.target); const arr=[]; for(let i=0;i<count;i++){const p={name:fd.getAll('name')[i].trim().replace(/\s+/g,' '),gender:fd.getAll('gender')[i],birth:fd.getAll('birth')[i],document:fd.getAll('document')[i].trim()}; if(p.name.length<3||p.document.length<6||!p.birth){result.innerHTML='<div class="error">Vui lòng kiểm tra họ tên, ngày sinh và giấy tờ của từng hành khách.</div>';return;} if(new Date(p.birth)>new Date()){result.innerHTML='<div class="error">Ngày sinh không được ở tương lai.</div>';return;} arr.push(p);} const email=document.getElementById('contactEmail').value.trim().toLowerCase(),phone=document.getElementById('contactPhone').value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){result.innerHTML='<div class="error">Email không hợp lệ.</div>';return;} if(!/^0\d{9,10}$/.test(phone)){result.innerHTML='<div class="error">Số điện thoại phải gồm 10-11 chữ số và bắt đầu bằng 0.</div>';return;} const payload={passengers:arr,contact:{email,phone},count}; write(TG.PASSENGERS,payload); write(TG.DRAFT,{...read(TG.DRAFT,{}),passengers:arr,contact:payload.contact}); location.href='seat.html';};
</script></body></html>
