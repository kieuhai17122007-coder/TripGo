<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Thanh toán</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card wide-card"><div class="stepper"><span>1 Hành khách</span><span>2 Chọn ghế</span><span>3 Xác nhận</span><span class="active">4 Thanh toán</span></div><p class="eyebrow dark">PAYMENT</p><h1>Thanh toán & hoàn tất</h1><div id="summary" class="notice"></div><label>Phương thức thanh toán<select id="method"><option>Thẻ nội địa</option><option>Thẻ quốc tế</option><option>Ví điện tử</option></select></label><div class="payment-note">Đây là thanh toán mô phỏng cho đồ án. Không nhập thông tin thẻ thật.</div><button class="primary-btn wide" id="payBtn">XÁC NHẬN ĐẶT VÉ</button><div id="result"></div></div></main><script src="../js/app.js"></script><script>
const f=read(TG.SELECTED,null),p=read(TG.PASSENGERS,null),seat=read(TG.SEAT,null),fare=read(TG.FARE,{multiplier:1,className:'Phổ thông',baggage:7}),q=read(TG.SEARCH,{}),draft=read(TG.DRAFT,{}),summary=document.getElementById('summary');
if(!f||!p||!seat||!draft.total){summary.textContent='Chưa đủ dữ liệu thanh toán.';document.getElementById('payBtn').disabled=true;}else summary.innerHTML=`<b>${escapeHTML(f.id)}</b> · ${AIRPORTS[f.from]} → ${AIRPORTS[f.to]} · ${dateVN(q.departure)}<br>Hành khách: <b>${p.count}</b> · Ghế: <b>${escapeHTML(seat)}</b> · Hạng: <b>${escapeHTML(fare.className)}</b><br>Tổng thanh toán: <strong>${formatMoney(draft.total)}</strong>`;
document.getElementById('payBtn').onclick=()=>{const bookings=getBookings(); const user=getCurrentUser(); const booking={code:bookingCode(),status:'confirmed',createdAt:new Date().toISOString(),userId:user?.id||null,contact:p.contact.email,contactPhone:p.contact.phone,passenger:p.passengers[0],passengers:p.passengers,flight:f,seat,tripType:q.tripType||'oneway',departureDate:q.departure||f.date,returnDate:q.returnDate||'',fareClass:fare.className,baggage:fare.baggage,paymentMethod:document.getElementById('method').value,total:Number(draft.total)}; bookings.push(booking);saveBookings(bookings);localStorage.removeItem(TG.DRAFT);localStorage.removeItem(TG.SELECTED);localStorage.removeItem(TG.PASSENGERS);localStorage.removeItem(TG.SEAT);localStorage.removeItem(TG.FARE);document.getElementById('payBtn').disabled=true;document.getElementById('result').innerHTML=`<div class="success-box"><div class="success-icon">✓</div><h2>Đặt vé thành công</h2><p>Mã đặt chỗ</p><strong class="booking-code">${escapeHTML(booking.code)}</strong><p>Đã gửi thông tin mô phỏng đến ${escapeHTML(booking.contact)}.</p><div class="button-row"><a class="primary-btn button-link" href="booking.html?code=${encodeURIComponent(booking.code)}">Tra cứu vé</a><a class="secondary-btn button-link" href="my-bookings.html">Vé của tôi</a></div></div>`;};
</script></body></html>
