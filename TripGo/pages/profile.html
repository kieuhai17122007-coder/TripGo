<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Tài khoản</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">✈ TripGo</a><nav><a href="../index.html">Đặt vé</a><a href="search.html">Chuyến bay</a><a href="my-bookings.html">Vé của tôi</a><a href="profile.html">Tài khoản</a></nav><button class="login-btn" onclick="logout()">Đăng xuất</button></div></header><main class="simple-page"><div class="form-card"><p class="eyebrow dark">MY ACCOUNT</p><h1>Thông tin tài khoản</h1><form id="form"><label>Họ và tên<input id="name" required></label><label>Email<input id="email" disabled></label><label>Số điện thoại<input id="phone" required></label><div id="result"></div><button class="primary-btn wide">CẬP NHẬT</button></form><p class="back"><a href="my-bookings.html">→ Xem vé của tôi</a></p></div></main><script src="../js/app.js"></script><script>if(requireLogin()){const u=getCurrentUser();name.value=u.name;email.value=u.email;phone.value=u.phone||'';document.getElementById('form').onsubmit=e=>{e.preventDefault();const us=getUsers(),i=us.findIndex(x=>x.id===u.id);if(name.value.trim().length<3||!/^0\d{9,10}$/.test(phone.value.trim())){result.innerHTML='<div class="error">Vui lòng kiểm tra họ tên và số điện thoại.</div>';return;}us[i].name=name.value.trim();us[i].phone=phone.value.trim();saveUsers(us);result.innerHTML='<div class="notice">Đã cập nhật thông tin tài khoản.</div>';};}</script></body></html>
