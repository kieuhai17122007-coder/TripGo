<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Đăng ký</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card"><a class="logo" href="../index.html">✈ TripGo</a><p class="eyebrow dark">ACCOUNT</p><h1>Đăng ký tài khoản</h1><form id="form"><label>Họ và tên<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Số điện thoại<input id="phone" required></label><label>Mật khẩu<input id="password" type="password" minlength="6" required></label><label>Xác nhận mật khẩu<input id="confirm" type="password" required></label><div id="result"></div><button class="primary-btn wide">ĐĂNG KÝ</button></form><p class="back"><a href="login.html">Đã có tài khoản? Đăng nhập</a></p></div></main><script src="../js/app.js"></script><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,r=document.getElementById('result');if(name.length<3){r.innerHTML='<div class="error">Họ tên phải có ít nhất 3 ký tự.</div>';return;}if(!/^0\d{9,10}$/.test(phone)){r.innerHTML='<div class="error">Số điện thoại không hợp lệ.</div>';return;}if(password.length<6){r.innerHTML='<div class="error">Mật khẩu tối thiểu 6 ký tự.</div>';return;}if(password!==confirm){r.innerHTML='<div class="error">Mật khẩu xác nhận không khớp.</div>';return;}const us=getUsers();if(us.some(u=>u.email===email)){r.innerHTML='<div class="error">Email đã được đăng ký.</div>';return;}us.push({id:makeId('USR'),name,email,phone,password,role:'user',createdAt:new Date().toISOString()});saveUsers(us);r.innerHTML='<div class="notice">Đăng ký thành công. <a href="login.html">Đăng nhập ngay →</a></div>';e.target.reset();};</script></body></html>
