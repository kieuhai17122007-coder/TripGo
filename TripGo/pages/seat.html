<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripGo - Chọn ghế</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/pages.css"></head><body><main class="simple-page"><div class="form-card wide-card"><div class="stepper"><span>1 Hành khách</span><span class="active">2 Chọn ghế</span><span>3 Xác nhận</span><span>4 Thanh toán</span></div><p class="eyebrow dark">SEAT SELECTION</p><h1>Chọn ghế</h1><p id="seatInfo"></p><div class="seat-legend"><span><i></i> Trống</span><span><i class="chosen"></i> Đang chọn</span><span><i class="occupied"></i> Đã chọn</span></div><div id="seats" class="seats plane"></div><div id="seatError"></div><button class="primary-btn wide" id="next">TIẾP TỤC XÁC NHẬN</button><p class="back"><a href="passenger.html">← Quay lại thông tin hành khách</a></p></div></main><script src="../js/app.js"></script><script>
const pax=read(TG.PASSENGERS,null),f=read(TG.SELECTED,null); const box=document.getElementById('seats'); const seats=[]; const occupied=new Set(getBookings().filter(b=>b.status!=='cancelled'&&b.flight?.id===f?.id).map(b=>b.seat).filter(Boolean));
if(!pax||!f){document.getElementById('seatError').innerHTML='<div class="error">Thiếu dữ liệu đặt vé.</div>';document.getElementById('next').disabled=true;} else {document.getElementById('seatInfo').textContent=`${pax.count} hành khách · ${f.airline} · ${f.from} → ${f.to}`;}
for(let r=1;r<=10;r++){for(const c of ['A','B','C','D','E','F']){const id=r+c,b=document.createElement('button');b.type='button';b.className='seat';b.textContent=id;if(occupied.has(id)){b.classList.add('occupied');b.disabled=true;}b.onclick=()=>{document.querySelectorAll('.seat:not(.occupied)').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');seats[0]=id;};box.appendChild(b);}}
document.getElementById('next').onclick=()=>{if(!seats[0]){document.getElementById('seatError').innerHTML='<div class="error">Hãy chọn một ghế.</div>';return;} write(TG.SEAT,seats[0]); write(TG.DRAFT,{...read(TG.DRAFT,{}),seat:seats[0]}); location.href='confirmation.html';};
</script></body></html>
