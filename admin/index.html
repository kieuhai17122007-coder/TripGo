<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TripGo · Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="admin-body bg-slate-50 text-slate-800">
    <div
      id="loginView"
      class="min-h-screen flex items-center justify-center p-4"
    >
      <div
        class="w-full max-w-md rounded-3xl bg-white p-7 sm:p-9 shadow-xl border border-slate-100"
      >
        <div class="text-3xl font-black text-blue-900">
          ✈ TripGo<span class="text-amber-500">.</span>
        </div>
        <p
          class="mt-2 text-sm font-bold tracking-widest text-amber-600 uppercase"
        >
          Admin Panel
        </p>
        <h1 class="text-2xl font-bold mt-7">Đăng nhập quản trị</h1>
        <p class="text-sm text-slate-500 mt-2">
          Quản lý chuyến bay và vé đặt trong dự án TripGo.
        </p>
        <form id="loginForm" class="space-y-4 mt-7">
          <label class="block text-sm font-semibold"
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              required
              class="field mt-2"
              placeholder="admin@tripgo.com" /></label
          ><label class="block text-sm font-semibold"
            >Mật khẩu<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="field mt-2"
              placeholder="Nhập mật khẩu"
          /></label>
          <p id="loginError" role="alert" class="text-sm text-red-600"></p>
          <button class="primary w-full">Đăng nhập</button>
        </form>
        <a
          href="../index.html"
          class="block text-center text-sm text-blue-700 mt-6 hover:underline"
          >← Về trang chủ</a
        >
      </div>
    </div>
    <div id="appView" class="admin-app hidden min-h-screen">
      <header
        class="admin-header bg-white border-b border-slate-200 sticky top-0 z-20"
      >
        <div
          class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center"
        >
          <a href="../index.html" class="text-2xl font-black text-blue-900"
            >✈ TripGo<span class="text-amber-500">.</span
            ><span class="text-xs ml-2 uppercase tracking-widest text-slate-500"
              >Admin</span
            ></a
          >
          <div class="flex gap-3 items-center text-sm">
            <span class="hidden sm:inline text-slate-500">admin@tripgo.com</span
            ><button id="logout" class="secondary">Đăng xuất</button>
          </div>
        </div>
      </header>
      <div class="admin-layout max-w-7xl md:flex min-h-[calc(100vh-128px)]">
        <nav
          class="admin-sidebar p-4 md:pt-8 md:w-60 flex md:flex-col gap-2 overflow-x-auto shrink-0"
          aria-label="Menu quản trị"
        >
          <button data-page="overview" class="nav active">
            ◫ <span>Tổng quan</span></button
          ><button data-page="flights" class="nav">
            ✈ <span>Chuyến bay</span></button
          ><button data-page="bookings" class="nav">
            ▤ <span>Vé đã đặt</span>
          </button>
        </nav>
        <main class="admin-main mx-10 flex-1 min-w-0 p-4 sm:p-6 md:py-8">
          <div class="flex items-start justify-between gap-3 flex-wrap mb-6">
            <div>
              <p
                class="text-xs font-bold tracking-widest uppercase text-amber-600"
              >
                TripGo / Quản trị
              </p>
              <h1 id="pageTitle" class="text-3xl font-bold mt-1">Tổng quan</h1>
              <p id="pageDescription" class="text-sm text-slate-500 mt-2"></p>
            </div>
            <button id="newFlight" class="primary hidden">
              + Thêm chuyến bay
            </button>
          </div>
          <div
            id="notice"
            role="status"
            class="hidden mb-4 rounded-xl p-3 text-sm"
          ></div>
          <div id="content"></div>
        </main>
      </div>
      <footer
        class="admin-footer bg-white border-t text-center text-xs text-slate-500 py-5"
      >
        © TripGo · Dự án mô phỏng đặt vé máy bay
      </footer>
    </div>
    <div
      id="modal"
      class="modal-backdrop hidden fixed inset-0 z-30 bg-slate-950/60 p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div
        class="bg-white rounded-3xl max-w-2xl mx-auto my-8 p-5 sm:p-8 shadow-2xl"
      >
        <div class="flex justify-between gap-4">
          <div>
            <p class="text-xs text-amber-600 uppercase font-bold">
              Quản lý chuyến bay
            </p>
            <h2 id="modalTitle" class="text-2xl font-bold mt-1">
              Thêm chuyến bay
            </h2>
          </div>
          <button id="closeModal" class="text-2xl self-start" aria-label="Đóng">
            ×
          </button>
        </div>
        <form id="flightForm" novalidate class="mt-6">
          <div class="grid sm:grid-cols-2 gap-4">
            <label class="label"
              >Mã chuyến bay<input
                class="field"
                name="id"
                maxlength="20"
                required
                placeholder="TG101" /></label
            ><label class="label"
              >Hãng bay<select class="field" name="airline"></select></label
            ><label class="label"
              >Điểm đi<select class="field" name="from"></select></label
            ><label class="label"
              >Điểm đến<select class="field" name="to"></select></label
            ><label class="label"
              >Ngày bay<input
                class="field"
                name="date"
                type="date"
                required /></label
            ><label class="label"
              >Máy bay<select class="field" name="aircraft"></select></label
            ><label class="label"
              >Giờ đi<input
                class="field"
                name="departure"
                type="time"
                required /></label
            ><label class="label"
              >Giờ đến<input
                class="field"
                name="arrival"
                type="time"
                required /></label
            ><label class="label"
              >Thời gian bay<input
                class="field"
                name="duration"
                placeholder="2 giờ 10 phút"
                maxlength="40"
                required /></label
            ><label class="label"
              >Giá vé (VNĐ)<input
                class="field"
                name="price"
                type="number"
                min="100000"
                max="100000000"
                step="1000"
                required /></label
            ><label class="label"
              >Hành lý (kg)<input
                class="field"
                name="baggage"
                type="number"
                min="0"
                max="100"
                required /></label
            ><label class="label"
              >Trạng thái<select class="field" name="status">
                <option value="active">Đang bán</option>
                <option value="inactive">Tạm dừng</option>
              </select></label
            >
          </div>
          <p id="formError" role="alert" class="text-red-600 text-sm mt-4"></p>
          <div class="flex justify-end gap-3 mt-6">
            <button id="cancelModal" type="button" class="secondary">Hủy</button
            ><button class="primary">Lưu chuyến bay</button>
          </div>
        </form>
      </div>
    </div>
    <script src="admin.js" defer></script>
  </body>
</html>
