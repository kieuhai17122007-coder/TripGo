
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TripGo - Chi tiết chuyến bay</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    * {
      box-sizing: border-box;
    }

    .detail-page {
      min-height: calc(100vh - 80px);
      background: #f5f6f8;
      padding: 45px 20px 70px;
    }

    .detail-wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }

    .detail-heading {
      margin-bottom: 25px;
    }

    .detail-heading small {
      color: #777;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .detail-heading h1 {
      margin: 8px 0 5px;
      font-size: 32px;
    }

    .detail-heading p {
      margin: 0;
      color: #777;
    }

    .flight-main-card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #e8e8e8;
    }

    .flight-banner {
      background: #111;
      color: #fff;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .airline-name {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .flight-number {
      font-size: 24px;
      font-weight: 700;
    }

    .flight-price-box {
      text-align: right;
    }

    .flight-price-label {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .flight-price {
      font-size: 24px;
      font-weight: 700;
    }

    .route-section {
      padding: 40px 35px;
    }

    .route-date {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .route-content {
      display: grid;
      grid-template-columns: 1fr 180px 1fr;
      align-items: center;
      gap: 20px;
    }

    .airport {
      padding: 10px;
    }

    .airport:last-child {
      text-align: right;
    }

    .airport-time {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 12px;
    }

    .airport-city {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .airport-code {
      color: #888;
      font-size: 14px;
    }

    .route-middle {
      text-align: center;
    }

    .route-duration {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .route-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-line::before,
    .route-line::after {
      content: "";
      height: 1px;
      background: #ccc;
      flex: 1;
    }

    .plane-icon {
      font-size: 22px;
    }

    .direct-text {
      margin-top: 10px;
      color: #777;
      font-size: 12px;
    }

    .info-section {
      border-top: 1px solid #eee;
      padding: 30px 35px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .info-box {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 18px;
    }

    .info-label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      font-weight: 600;
    }

    .notice {
      margin-top: 20px;
      padding: 15px 18px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .bottom-action {
      border-top: 1px solid #eee;
      padding: 22px 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .selected-text {
      color: #666;
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .action-buttons button {
      min-width: 150px;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button {
      background: #fff;
      border: 1px solid #ccc;
      color: #222;
    }

    .continue-button {
      background: #111;
      border: 1px solid #111;
      color: #fff;
    }

    .back-button:hover,
    .continue-button:hover {
      opacity: 0.8;
    }

    .not-found {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      background: #fff;
      padding: 45px 30px;
      border-radius: 15px;
      border: 1px solid #e5e5e5;
    }

    .not-found h2 {
      margin-bottom: 10px;
    }

    .not-found p {
      color: #777;
      margin-bottom: 25px;
    }

    .not-found button {
      border: none;
      background: #111;
      color: #fff;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .detail-page {
        padding: 25px 15px 50px;
      }

      .detail-heading h1 {
        font-size: 26px;
      }

      .flight-banner {
        padding: 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .flight-price-box {
        text-align: left;
      }

      .route-section {
        padding: 30px 20px;
      }

      .route-content {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .airport:last-child {
        text-align: left;
      }

      .route-middle {
        order: 2;
      }

      .info-section {
        padding: 25px 20px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .bottom-action {
        padding: 20px;
        flex-direction: column;
        align-items: stretch;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container nav">

      <a class="logo" href="../index.html">
        ✈ TripGo
      </a>

      <nav>
        <a href="../index.html">Đặt vé</a>
        <a href="search.html">Chuyến bay</a>
        <a href="../index.html#services">Dịch vụ</a>
        <a href="booking.html">Tra cứu</a>
        <a href="checkin.html">Check-in</a>
      </nav>

      <a class="login-btn" href="login.html">
        Đăng nhập
      </a>

    </div>
  </header>


  <main class="detail-page">

    <div class="detail-wrapper">

      <div class="detail-heading">
        <small>FLIGHT INFORMATION</small>

        <h1>
          Chi tiết chuyến bay
        </h1>

        <p>
          Kiểm tra thông tin chuyến bay trước khi tiếp tục đặt vé.
        </p>
      </div>


      <div id="flightDetail"></div>

    </div>

  </main>


  <script>
    const flightDetail =
      document.getElementById("flightDetail");

    const savedFlight =
      localStorage.getItem("tripgo_selected_flight");


    if (!savedFlight) {

      flightDetail.innerHTML = `
        <div class="not-found">

          <h2>
            Không tìm thấy chuyến bay
          </h2>

          <p>
            Bạn chưa chọn chuyến bay.
          </p>

          <button onclick="goSearch()">
            QUAY LẠI CHỌN CHUYẾN
          </button>

        </div>
      `;

    } else {

      const flight =
        JSON.parse(savedFlight);

      const price =
        Number(flight.price).toLocaleString("vi-VN");


      flightDetail.innerHTML = `

        <div class="flight-main-card">


          <div class="flight-banner">

            <div>

              <div class="airline-name">
                ${flight.airline}
              </div>

              <div class="flight-number">
                Chuyến bay ${flight.id}
              </div>

            </div>


            <div class="flight-price-box">

              <div class="flight-price-label">
                Giá vé
              </div>

              <div class="flight-price">
                ${price} ₫
              </div>

            </div>

          </div>


          <div class="route-section">

            <div class="route-date">
              Ngày bay: ${flight.date}
            </div>


            <div class="route-content">


              <div class="airport">

                <div class="airport-time">
                  ${flight.departure}
                </div>

                <div class="airport-city">
                  ${flight.from}
                </div>

                <div class="airport-code">
                  Sân bay ${flight.fromCode}
                </div>

              </div>


              <div class="route-middle">

                <div class="route-duration">
                  ${flight.duration}
                </div>

                <div class="route-line">
                  <span class="plane-icon">
                    ✈
                  </span>
                </div>

                <div class="direct-text">
                  Chuyến bay thẳng
                </div>

              </div>


              <div class="airport">

                <div class="airport-time">
                  ${flight.arrival}
                </div>

                <div class="airport-city">
                  ${flight.to}
                </div>

                <div class="airport-code">
                  Sân bay ${flight.toCode}
                </div>

              </div>


            </div>

          </div>


          <div class="info-section">

            <div class="section-title">
              Thông tin chuyến bay
            </div>


            <div class="info-grid">


              <div class="info-box">

                <span class="info-label">
                  Mã chuyến bay
                </span>

                <span class="info-value">
                  ${flight.id}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  Hãng hàng không
                </span>

                <span class="info-value">
                  ${flight.airline}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  Ngày khởi hành
                </span>

                <span class="info-value">
                  ${flight.date}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  Giờ khởi hành
                </span>

                <span class="info-value">
                  ${flight.departure}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  Giờ đến
                </span>

                <span class="info-value">
                  ${flight.arrival}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  Thời gian bay
                </span>

                <span class="info-value">
                  ${flight.duration}
                </span>

              </div>


            </div>


            <div class="notice">
              Giá vé trên chưa bao gồm các dịch vụ bổ sung.
              Bạn có thể lựa chọn hạng vé, hành lý và chỗ ngồi
              ở các bước tiếp theo.
            </div>

          </div>


          <div class="bottom-action">

            <div class="selected-text">
              ✓ Bạn đã chọn chuyến bay ${flight.id}
            </div>


            <div class="action-buttons">

              <button
                class="back-button"
                onclick="goSearch()"
              >
                ← Quay lại
              </button>


              <button
                class="continue-button"
                onclick="continueBooking()"
              >
                Tiếp tục đặt vé →
              </button>

            </div>

          </div>


        </div>
      `;
    }


    function goSearch() {
      window.location.href = "search.html";
    }


    function continueBooking() {
      window.location.href = "passenger.html";
    }
  </script>

</body>
</html>
