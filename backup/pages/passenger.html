
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripGo - Hành khách</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">

    <style>
      .error {
        color: #d93025;
        font-size: 13px;
        margin-top: 5px;
        display: block;
      }

      .input-error {
        border: 1px solid #d93025 !important;
      }
    </style>
  </head>

  <body>
    <main class="simple-page">
      <div class="form-card">
        <p class="eyebrow dark">BOOKING</p>
        <h1>Thông tin hành khách</h1>

        <label>
          Họ và tên
          <input id="name" placeholder="NGUYEN VAN A">
          <small id="nameError" class="error"></small>
        </label>

        <label>
          Email
          <input id="email" type="email" placeholder="email@example.com">
          <small id="emailError" class="error"></small>
        </label>

        <label>
          Số điện thoại
          <input id="phone" placeholder="09xxxxxxxx">
          <small id="phoneError" class="error"></small>
        </label>

        <label>
          Số CCCD/Hộ chiếu
          <input id="document" placeholder="Nhập số giấy tờ">
          <small id="documentError" class="error"></small>
        </label>

        <button class="primary-btn wide" onclick="next()">
          TIẾP TỤC CHỌN GHẾ
        </button>
      </div>
    </main>

    <script>
      function next() {
        const name = document.getElementById('name');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const documentInput = document.getElementById('document');

        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');
        const documentError = document.getElementById('documentError');

        nameError.textContent = '';
        emailError.textContent = '';
        phoneError.textContent = '';
        documentError.textContent = '';

        name.classList.remove('input-error');
        email.classList.remove('input-error');
        phone.classList.remove('input-error');
        documentInput.classList.remove('input-error');

        let valid = true;

        if (name.value.trim() === '') {
          nameError.textContent = 'Vui lòng nhập họ và tên';
          name.classList.add('input-error');
          valid = false;
        }

        if (email.value.trim() === '') {
          emailError.textContent = 'Vui lòng nhập email';
          email.classList.add('input-error');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          emailError.textContent = 'Email không hợp lệ';
          email.classList.add('input-error');
          valid = false;
        }

        if (phone.value.trim() === '') {
          phoneError.textContent = 'Vui lòng nhập số điện thoại';
          phone.classList.add('input-error');
          valid = false;
        } else if (!/^(0|\+84)[0-9]{9}$/.test(phone.value)) {
          phoneError.textContent = 'Số điện thoại không hợp lệ';
          phone.classList.add('input-error');
          valid = false;
        }

        if (documentInput.value.trim() === '') {
          documentError.textContent = 'Vui lòng nhập số CCCD/Hộ chiếu';
          documentInput.classList.add('input-error');
          valid = false;
        }

        if (!valid) {
          return;
        }

        const data = {
          name: name.value.trim(),
          email: email.value.trim(),
          phone: phone.value.trim(),
          document: documentInput.value.trim()
        };

        localStorage.setItem(
          'tripgo_passenger',
          JSON.stringify(data)
        );

        location.href = 'seat.html';
      }
    </script>
  </body>
</html>
