
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TripGo - Hành khách</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">

    <style>
      .error {
        color: #d93025;
        font-size: 13px;
        margin-top: 5px;
        display: block;
      }

      .input-error {
        border: 1px solid #d93025 !important;
      }

      .passenger-count {
        margin-top: 20px;
      }

      .passenger-count input {
        width: 100%;
      }

      .price-box {
        margin-top: 25px;
        padding: 20px;
        background: #f7f7f7;
        border-radius: 10px;
      }

      .price-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 15px;
      }

      .total-price {
        display: flex;
        justify-content: space-between;
        padding-top: 15px;
        margin-top: 10px;
        border-top: 1px solid #ddd;
        font-size: 20px;
        font-weight: bold;
      }

      .flight-info {
        margin-bottom: 20px;
        padding: 15px;
        background: #f7f7f7;
        border-radius: 10px;
      }

      .flight-info p {
        margin: 5px 0;
      }

      .flight-not-found {
        color: #d93025;
        font-size: 14px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>

    <main class="simple-page">

      <div class="form-card">

        <p class="eyebrow dark">
          BOOKING
        </p>

        <h1>
          Thông tin hành khách
        </h1>


        <div id="flightInfo" class="flight-info"></div>


        <label>
          Họ và tên

          <input
            id="name"
            placeholder="NGUYEN VAN A"
          >

          <small
            id="nameError"
            class="error"
          ></small>
        </label>


        <label>
          Email

          <input
            id="email"
            type="email"
            placeholder="email@example.com"
          >

          <small
            id="emailError"
            class="error"
          ></small>
        </label>


        <label>
          Số điện thoại

          <input
            id="phone"
            placeholder="09xxxxxxxx"
          >

          <small
            id="phoneError"
            class="error"
          ></small>
        </label>


        <label>
          Số CCCD/Hộ chiếu

          <input
            id="document"
            placeholder="Nhập số giấy tờ"
          >

          <small
            id="documentError"
            class="error"
          ></small>
        </label>


        <label class="passenger-count">
          Số lượng hành khách

          <input
            id="passengerCount"
            type="number"
            min="1"
            max="9"
            value="1"
          >

          <small
            id="passengerCountError"
            class="error"
          ></small>
        </label>


        <div class="price-box">

          <div class="price-row">

            <span>
              Giá vé / hành khách
            </span>

            <strong id="unitPrice">
              0 ₫
            </strong>

          </div>


          <div class="price-row">

            <span>
              Số lượng hành khách
            </span>

            <strong id="displayPassengerCount">
              1
            </strong>

          </div>


          <div class="total-price">

            <span>
              Tổng tiền
            </span>

            <span id="totalPrice">
              0 ₫
            </span>

          </div>

        </div>


        <button
          class="primary-btn wide"
          onclick="next()"
        >
          TIẾP TỤC CHỌN LOẠI VÉ
        </button>

      </div>

    </main>


    <script>

      const savedFlight =
        localStorage.getItem('tripgo_selected_flight');


      const flightInfo =
        document.getElementById('flightInfo');

      const unitPrice =
        document.getElementById('unitPrice');

      const totalPrice =
        document.getElementById('totalPrice');

      const passengerCount =
        document.getElementById('passengerCount');

      const displayPassengerCount =
        document.getElementById('displayPassengerCount');


      let flight = null;


      if (savedFlight) {

        flight = JSON.parse(savedFlight);

        const price =
          Number(flight.price);

        flightInfo.innerHTML = `
          <p>
            <strong>Chuyến bay:</strong>
            ${flight.id}
          </p>

          <p>
            <strong>Hãng bay:</strong>
            ${flight.airline}
          </p>

          <p>
            <strong>Hành trình:</strong>
            ${flight.from}
            (${flight.fromCode})
            →
            ${flight.to}
            (${flight.toCode})
          </p>

          <p>
            <strong>Giờ bay:</strong>
            ${flight.departure}
            -
            ${flight.arrival}
          </p>
        `;

        unitPrice.textContent =
          price.toLocaleString('vi-VN') + ' ₫';

        updatePrice();

      } else {

        flightInfo.innerHTML = `
          <div class="flight-not-found">
            Không tìm thấy thông tin chuyến bay.
            Vui lòng quay lại chọn chuyến bay.
          </div>
        `;
      }


      function updatePrice() {

        if (!flight) {
          return;
        }

        let count =
          parseInt(passengerCount.value);

        if (
          isNaN(count) ||
          count < 1
        ) {
          count = 1;
        }

        if (count > 9) {
          count = 9;
          passengerCount.value = 9;
        }

        const price =
          Number(flight.price);

        const total =
          price * count;

        displayPassengerCount.textContent =
          count;

        totalPrice.textContent =
          total.toLocaleString('vi-VN') + ' ₫';
      }


      passengerCount.addEventListener(
        'input',
        updatePrice
      );


      function next() {

        const name =
          document.getElementById('name');

        const email =
          document.getElementById('email');

        const phone =
          document.getElementById('phone');

        const documentInput =
          document.getElementById('document');


        const nameError =
          document.getElementById('nameError');

        const emailError =
          document.getElementById('emailError');

        const phoneError =
          document.getElementById('phoneError');

        const documentError =
          document.getElementById('documentError');

        const passengerCountError =
          document.getElementById(
            'passengerCountError'
          );


        nameError.textContent = '';
        emailError.textContent = '';
        phoneError.textContent = '';
        documentError.textContent = '';
        passengerCountError.textContent = '';


        name.classList.remove(
          'input-error'
        );

        email.classList.remove(
          'input-error'
        );

        phone.classList.remove(
          'input-error'
        );

        documentInput.classList.remove(
          'input-error'
        );

        passengerCount.classList.remove(
          'input-error'
        );


        let valid = true;


        if (name.value.trim() === '') {

          nameError.textContent =
            'Vui lòng nhập họ và tên';

          name.classList.add(
            'input-error'
          );

          valid = false;
        }


        if (email.value.trim() === '') {

          emailError.textContent =
            'Vui lòng nhập email';

          email.classList.add(
            'input-error'
          );

          valid = false;

        } else if (
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email.value)
        ) {

          emailError.textContent =
            'Email không hợp lệ';

          email.classList.add(
            'input-error'
          );

          valid = false;
        }


        if (phone.value.trim() === '') {

          phoneError.textContent =
            'Vui lòng nhập số điện thoại';

          phone.classList.add(
            'input-error'
          );

          valid = false;

        } else if (
          !/^(0|\+84)[0-9]{9}$/
            .test(phone.value)
        ) {

          phoneError.textContent =
            'Số điện thoại không hợp lệ';

          phone.classList.add(
            'input-error'
          );

          valid = false;
        }


        if (
          documentInput.value.trim() === ''
        ) {

          documentError.textContent =
            'Vui lòng nhập số CCCD/Hộ chiếu';

          documentInput.classList.add(
            'input-error'
          );

          valid = false;
        }


        const count =
          parseInt(passengerCount.value);


        if (
          isNaN(count) ||
          count < 1
        ) {

          passengerCountError.textContent =
            'Số lượng hành khách phải từ 1 người';

          passengerCount.classList.add(
            'input-error'
          );

          valid = false;

        } else if (count > 9) {

          passengerCountError.textContent =
            'Số lượng hành khách tối đa là 9 người';

          passengerCount.classList.add(
            'input-error'
          );

          valid = false;
        }


        if (!valid) {
          return;
        }


        const price =
          Number(flight.price);

        const total =
          price * count;


        const data = {

          name:
            name.value.trim(),

          email:
            email.value.trim(),

          phone:
            phone.value.trim(),

          document:
            documentInput.value.trim(),

          passengerCount:
            count,

          unitPrice:
            price,

          totalPrice:
            total
        };


        localStorage.setItem(
          'tripgo_passenger',
          JSON.stringify(data)
        );


        location.href = '../../src/ticket.html';
      }

    </script>

  </body>
</html>
