
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TripGo - Xác nhận thông tin</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .confirmation-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .confirmation-card {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .eyebrow {
      color: #777;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .description {
      color: #666;
      margin-bottom: 30px;
    }

    .section {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .section-title {
      background: #f8f9fb;
      padding: 15px 18px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #e5e7eb;
    }

    .section-content {
      padding: 18px;
    }

    .flight-route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .airport {
      flex: 1;
    }

    .airport:last-child {
      text-align: right;
    }

    .airport-code {
      font-size: 28px;
      font-weight: bold;
    }

    .airport-name {
      color: #666;
      margin-top: 5px;
    }

    .arrow {
      font-size: 28px;
      color: #777;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .info-item {
      padding: 12px;
      background: #f8f9fb;
      border-radius: 8px;
    }

    .info-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: bold;
      word-break: break-word;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 18px;
      border-top: 2px solid #222;
      font-size: 22px;
      font-weight: bold;
    }

    .total-price {
      color: #e53935;
    }

    .success-box {
      background: #ecfdf3;
      border: 1px solid #b7ebc6;
      color: #166534;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .booking-code {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 13px 22px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #111827;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #222;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    @media (max-width: 700px) {
      .confirmation-page {
        margin: 10px auto;
        padding: 10px;
      }

      .confirmation-card {
        padding: 20px;
      }

      .flight-route {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .airport:last-child {
        text-align: center;
      }

      .arrow {
        transform: rotate(90deg);
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="confirmation-page">

    <div class="confirmation-card">

      <p class="eyebrow">BOOKING CONFIRMATION</p>

      <h1>Xác nhận thông tin đặt vé</h1>

      <p class="description">
        Vui lòng kiểm tra lại toàn bộ thông tin trước khi hoàn tất đặt vé.
      </p>

      <div id="confirmationContent"></div>

    </div>

  </main>

  <script src="./confirmation.js"></script>

</body>
</html>
