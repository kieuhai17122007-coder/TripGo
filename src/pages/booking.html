<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripGo - Tra cứu đặt vé</title>
  <link rel="stylesheet" href="/src/css/main.css"><link rel="stylesheet" href="/src/css/pages.css">
</head>
<body>
<header class="header">
  <div class="container nav">
    <a class="logo" href="/" aria-label="TripGo - Trang chủ">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><path d="M21.7 10.9c.4.2.4.8 0 1l-7.2 3.3-1.5 5.1c-.1.4-.5.7-.9.7h-1c-.3 0-.5-.3-.4-.6l.8-4.2-3.2 1.4-1.8 2.2c-.2.2-.5.3-.8.2l-.8-.3c-.3-.1-.4-.5-.2-.8l1.2-2.8-3.1-1.4c-.4-.2-.4-.7 0-.9l.8-.4c.2-.1.4-.1.6 0l4 1.1 3.1-1.5-.9-4.2c-.1-.3.1-.6.4-.7l.9-.2c.4-.1.8.1 1 .4l2 3.4 7.2-2.7c.7-.2 1.3.1 1.6.7l.2.4z"/></svg></span><span class="logo-text">TripGo</span></a>
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a data-nav="home" href="/">Đặt vé</a>
      <a data-nav="flights" href="/src/pages/search.html">Chuyến bay</a>
      <a data-nav="services" href="/#services">Dịch vụ</a>
      <a data-nav="booking" href="/src/pages/booking.html">Tra cứu</a>
      <a data-nav="checkin" href="/src/pages/checkin.html">Check-in</a>
    </nav>
    <div class="nav-account">
      <a class="login-btn" data-auth-link href="/src/pages/login.html">Đăng nhập</a>
    </div>
  </div>
</header>
<main class="simple-page"><div class="form-card">
  <p class="eyebrow dark">MANAGE BOOKING</p><h1>Tra cứu đặt chỗ</h1>
  <p>Nhập mã đặt chỗ và Email/Số điện thoại để xem thông tin vé.</p>
  <label>Mã đặt chỗ<input id="code" type="text" placeholder="Ví dụ: TG123456"></label>
  <label>Email/Số điện thoại<input id="contact" type="text" placeholder="Nhập Email hoặc số điện thoại"></label>
  <button class="primary-btn wide" id="lookupBtn">TRA CỨU</button><div id="result"></div>
</div></main>
<script type="module">
import '../js/auth.js';
window.TripGoAuth.updateAuthUI();
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const formatPrice = value => `${Number(value || 0).toLocaleString('vi-VN')} VNĐ`;
document.getElementById('lookupBtn').addEventListener('click', () => {
  const code = document.getElementById('code').value.trim().toUpperCase();
  const contact = document.getElementById('contact').value.trim().toLowerCase();
  const result = document.getElementById('result');
  if (!code || !contact) { result.innerHTML='<div class="error">Vui lòng nhập mã đặt chỗ và Email/Số điện thoại.</div>'; return; }
  const booking = window.TripGoAuth.getBookings().find(item => {
    const email = item.passenger?.email?.toLowerCase() || '';
    const phone = item.passenger?.phone || '';
    return item.bookingCode?.toUpperCase() === code && (email === contact || phone === contact);
  });
  if (!booking) { result.innerHTML='<div class="error">Không tìm thấy đặt chỗ phù hợp.</div>'; return; }
  result.innerHTML=`<div class="notice"><h3>Thông tin đặt vé</h3>
    <p><b>Mã đặt chỗ:</b> ${escapeHtml(booking.bookingCode)}</p>
    <p><b>Hành khách:</b> ${escapeHtml(booking.passenger?.fullName || 'N/A')}</p>
    <p><b>Email:</b> ${escapeHtml(booking.passenger?.email || 'N/A')}</p>
    <p><b>Số điện thoại:</b> ${escapeHtml(booking.passenger?.phone || 'N/A')}</p>
    <p><b>Chuyến bay:</b> ${escapeHtml(booking.flight?.flightNumber || 'N/A')}</p>
    <p><b>Hành trình:</b> ${escapeHtml(booking.flight?.from || '')} → ${escapeHtml(booking.flight?.to || '')}</p>
    <p><b>Số hành khách:</b> ${escapeHtml(booking.passengerCount || 1)}</p><p><b>Ghế:</b> ${escapeHtml((booking.seats || booking.seat || []).toString().replaceAll(',', ', '))}</p><p><b>Loại vé:</b> ${escapeHtml(booking.ticketType || 'N/A')}</p>
    <p><b>Tổng tiền:</b> ${formatPrice(booking.totalPrice)}</p><p><b>Trạng thái:</b> ${escapeHtml(booking.status || 'Đã đặt vé')}</p></div>`;
});
</script>
<script type="module" src="/src/js/auth-page.js"></script>
</body></html>
