<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripGo - Check-in vé máy bay</title>
    <link rel="stylesheet" href="/src/css/main.css" />
    <link rel="stylesheet" href="/src/css/user-experience.css" />
    <style>
      /* CSS riêng cho trang check-in */
      .checkin-wrapper {
        padding: 60px 0;
        background: linear-gradient(180deg, #e6f0fa 0%, #f8fafc 300px);
        min-height: calc(100vh - 72px);
      }
      .search-card {
        max-width: 600px;
        margin: 0 auto;
        padding: 35px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(13, 42, 70, 0.08);
        background: #fff;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #334155;
      }
      .form-group input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        font-size: 15px;
        outline: none;
        transition: all 0.3s;
      }
      .form-group input:focus {
        background: #fff;
        border-color: #075ea8;
        box-shadow: 0 0 0 4px rgba(7, 94, 168, 0.1);
      }
      .error {
        color: #dc2626;
        background: #fef2f2;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-weight: 600;
        display: none;
      }

      /* CSS cho Thẻ lên máy bay (Boarding Pass) */
      .boarding-pass {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(13, 42, 70, 0.1);
        overflow: hidden;
        display: none; /* Ẩn ban đầu */
        animation: slideUp 0.5s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .bp-header {
        background: #075ea8;
        color: #fff;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .bp-header h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 1px;
      }
      .bp-header .badge {
        background: #10b981;
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 800;
      }
      .bp-body {
        display: flex;
        padding: 30px;
        border-bottom: 2px dashed #cbd5e1;
        position: relative;
      }
      .bp-body::before,
      .bp-body::after {
        content: "";
        position: absolute;
        bottom: -15px;
        width: 30px;
        height: 30px;
        background: #f8fafc;
        border-radius: 50%;
      }
      .bp-body::before {
        left: -15px;
      }
      .bp-body::after {
        right: -15px;
      }
      .bp-info {
        flex: 1;
      }
      .bp-info p {
        margin-bottom: 15px;
        display: flex;
        font-size: 15px;
        color: #334155;
      }
      .bp-info span {
        width: 150px;
        color: #64748b;
        font-weight: 600;
      }
      .bp-info strong {
        color: #0f172a;
        font-weight: 800;
      }
      .seat-highlight {
        color: #e11d48 !important;
        font-size: 20px;
      }
      .bp-qr {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-left: 30px;
        border-left: 2px dashed #cbd5e1;
      }
      .bp-qr img {
        width: 160px;
        height: 160px;
        border-radius: 12px;
      }
      .bp-qr small {
        margin-top: 10px;
        color: #64748b;
        font-size: 12px;
      }
      .bp-footer {
        padding: 20px 30px;
        background: #f8fafc;
        display: flex;
        gap: 15px;
        justify-content: flex-end;
      }
      .btn-print,
      .btn-back {
        padding: 12px 24px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        border: none;
      }
      .btn-print {
        background: #075ea8;
        color: #fff;
      }
      .btn-back {
        background: #fff;
        color: #075ea8;
        border: 1px solid #075ea8;
      }
    </style>
  </head>
  <body>
    <!-- Thanh Header (Bạn có thể copy từ file khác sang, mình để tạm bản ngắn gọn) -->
    <header class="header">
      <div class="container nav">
        <a class="logo" href="/">
          <span class="logo-mark">✈</span><span class="logo-text">TripGo</span>
        </a>
        <nav class="main-nav">
          <a data-nav="checkin" href="/src/pages/checkin.html">Check-in</a>
        </nav>
        <div class="nav-account">
          <a class="login-btn" data-auth-link href="/src/pages/login.html"
            >Đăng nhập</a
          >
        </div>
      </div>
    </header>

    <main class="checkin-wrapper">
      <div class="container">
        <div class="page-title" style="text-align: center; margin-bottom: 40px">
          <h1>Check-in trực tuyến</h1>
          <p>Làm thủ tục bay nhanh chóng, nhận thẻ lên máy bay điện tử.</p>
        </div>

        <!-- FORM CHECK-IN -->
        <div class="search-card" id="formContainer">
          <div id="errorMsg" class="error"></div>
          <form id="checkinForm">
            <div class="form-group">
              <label>Mã đặt chỗ (Booking Code)</label>
              <input
                type="text"
                id="bookingCode"
                placeholder="VD: TG123456"
                required
              />
            </div>
            <div class="form-group">
              <label>Số điện thoại hoặc CCCD</label>
              <input
                type="text"
                id="document"
                placeholder="Nhập số điện thoại hoặc CCCD"
                required
              />
            </div>
            <button
              type="submit"
              class="primary-btn wide"
              style="margin-top: 10px; height: 54px"
            >
              Làm thủ tục Check-in
            </button>
          </form>
        </div>

        <!-- KẾT QUẢ THẺ LÊN MÁY BAY -->
        <div id="boardingPass" class="boarding-pass"></div>
      </div>
    </main>

    <!-- Import file JS xử lý -->
    <script type="module" src="/src/js/checkin.js"></script>
  </body>
</html>
