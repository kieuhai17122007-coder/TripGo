<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TripGo - Check-in</title>
<link rel="stylesheet" href="/src/css/main.css"><link rel="stylesheet" href="/src/css/pages.css"></head>
<body>
<header class="header">
  <div class="container nav">
    <a class="logo" href="/" aria-label="TripGo - Trang chủ">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><path d="M21.7 10.9c.4.2.4.8 0 1l-7.2 3.3-1.5 5.1c-.1.4-.5.7-.9.7h-1c-.3 0-.5-.3-.4-.6l.8-4.2-3.2 1.4-1.8 2.2c-.2.2-.5.3-.8.2l-.8-.3c-.3-.1-.4-.5-.2-.8l1.2-2.8-3.1-1.4c-.4-.2-.4-.7 0-.9l.8-.4c.2-.1.4-.1.6 0l4 1.1 3.1-1.5-.9-4.2c-.1-.3.1-.6.4-.7l.9-.2c.4-.1.8.1 1 .4l2 3.4 7.2-2.7c.7-.2 1.3.1 1.6.7l.2.4z"/></svg></span><span class="logo-text">TripGo</span></a>
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a data-nav="home" href="/">Đặt vé</a>
      <a data-nav="flights" href="/src/pages/search.html">Chuyến bay</a>
      <a data-nav="services" href="/#services">Dịch vụ</a>
      <a data-nav="booking" href="/src/pages/booking.html">Tra cứu</a>
      <a data-nav="checkin" href="/src/pages/checkin.html">Check-in</a>
    </nav>
    <div class="nav-account">
      <a class="login-btn" data-auth-link href="/src/pages/login.html">Đăng nhập</a>
    </div>
  </div>
</header>
<main class="simple-page"><div class="form-card"><p class="eyebrow dark">ONLINE CHECK-IN</p><h1>Check-in trực tuyến</h1><p>Nhập mã đặt chỗ và họ hành khách để bắt đầu.</p>
<label>Mã đặt chỗ<input id="code" placeholder="TG123456"></label><label>Họ hành khách<input id="surname" placeholder="NGUYEN"></label>
<button class="primary-btn wide" id="checkinBtn">CHECK-IN</button><div id="result"></div></div></main>
<script type="module">
import '../js/auth.js'; window.TripGoAuth.updateAuthUI();
document.getElementById('checkinBtn').addEventListener('click',()=>{
 const code=document.getElementById('code').value.trim().toUpperCase(), surname=document.getElementById('surname').value.trim().toLowerCase(), result=document.getElementById('result');
 const bookings=window.TripGoAuth.getBookings(); const booking=bookings.find(item=>item.bookingCode?.toUpperCase()===code && (item.passenger?.fullName||'').toLowerCase().split(' ').pop()===surname);
 if(!booking){result.innerHTML='<div class="error">Không tìm thấy đặt chỗ. Kiểm tra mã đặt chỗ và họ hành khách.</div>';return;}
 if(booking.status==='Đã hủy'){result.innerHTML='<div class="error">Đặt chỗ này đã bị hủy.</div>';return;}
 booking.status='Đã check-in'; window.TripGoAuth.saveBookings(bookings);
 result.innerHTML=`<div class="notice">Check-in thành công cho mã <b>${booking.bookingCode}</b>. Ghế: <b>${booking.seat||'Chưa chọn'}</b>.</div>`;
});
</script>
<script type="module" src="/src/js/auth-page.js"></script>
</body></html>
