<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripGo - Đăng nhập</title>

  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/css/pages.css">
</head>

<body>

  <main class="simple-page">

    <div class="form-card">

      <a class="logo" href="/">✈ TripGo</a>

      <h1>Đăng nhập</h1>
      <p>Đăng nhập để đặt vé. Bạn phải có tài khoản TripGo trước khi đặt vé.</p>

      <form id="loginForm" novalidate>
      <!-- Email -->
      <label>
        Email
        <input
          type="email"
          id="email"
          placeholder="email@example.com"
        >
      </label>

      <!-- Mật khẩu -->
      <label>
        Mật khẩu
        <input
          type="password"
          id="password"
          placeholder="••••••••"
        >
      </label>

      <button class="primary-btn wide" type="submit">ĐĂNG NHẬP</button>
      </form>

      <!-- Thông báo -->
      <div id="result"></div>

      <p class="back"><small>Demo admin: admin@tripgo.vn / admin123</small></p>

      <p class="back">
        Chưa có tài khoản?
        <a href="/src/pages/register.html">Đăng ký</a>
      </p>

      <p class="back">
        <a href="/">← Về trang chủ</a>
      </p>

    </div>

  </main>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
