
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TripGo - Tìm chuyến bay</title>

    <link rel="stylesheet" href="../css/search.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                TripGo
            </a>

            <nav class="navigation">

                <a href="index.html">
                    Đặt vé
                </a>

                <a href="search.html" class="active">
                    Chuyến bay
                </a>

                <a href="index.html#services">
                    Dịch vụ
                </a>

                <a href="booking.html">
                    Tra cứu
                </a>

                <a href="checkin.html">
                    Check-in
                </a>

            </nav>

        </div>

    </header>


    <main class="container main-content">

        <section class="page-heading">

            <span class="eyebrow">
                FLIGHT SEARCH
            </span>

            <h1>
                Tìm chuyến bay
            </h1>

            <p>
                Tìm kiếm chuyến bay phù hợp với hành trình của bạn.
            </p>

        </section>


        <section class="search-card">

            <div class="trip-type">

                <label class="radio-option">

                    <input
                        type="radio"
                        name="tripType"
                        value="oneway"
                        checked
                    >

                    <span>
                        Một chiều
                    </span>

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="tripType"
                        value="roundtrip"
                    >

                    <span>
                        Khứ hồi
                    </span>

                </label>

            </div>


            <div class="search-grid">


                <div class="form-group">

                    <label for="from">
                        Điểm đi
                    </label>

                    <select id="from">

                        <option value="">
                            Chọn điểm đi
                        </option>

                        <option value="HAN">
                            Hà Nội (HAN)
                        </option>

                        <option value="SGN">
                            TP. Hồ Chí Minh (SGN)
                        </option>

                        <option value="DAD">
                            Đà Nẵng (DAD)
                        </option>

                        <option value="CXR">
                            Nha Trang (CXR)
                        </option>

                        <option value="PQC">
                            Phú Quốc (PQC)
                        </option>

                        <option value="HPH">
                            Hải Phòng (HPH)
                        </option>

                        <option value="HUI">
                            Huế (HUI)
                        </option>

                        <option value="VCA">
                            Cần Thơ (VCA)
                        </option>

                        <option value="UIH">
                            Quy Nhơn (UIH)
                        </option>

                        <option value="VDO">
                            Vân Đồn (VDO)
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="to">
                        Điểm đến
                    </label>

                    <select id="to">

                        <option value="">
                            Chọn điểm đến
                        </option>

                        <option value="HAN">
                            Hà Nội (HAN)
                        </option>

                        <option value="SGN">
                            TP. Hồ Chí Minh (SGN)
                        </option>

                        <option value="DAD">
                            Đà Nẵng (DAD)
                        </option>

                        <option value="CXR">
                            Nha Trang (CXR)
                        </option>

                        <option value="PQC">
                            Phú Quốc (PQC)
                        </option>

                        <option value="HPH">
                            Hải Phòng (HPH)
                        </option>

                        <option value="HUI">
                            Huế (HUI)
                        </option>

                        <option value="VCA">
                            Cần Thơ (VCA)
                        </option>

                        <option value="UIH">
                            Quy Nhơn (UIH)
                        </option>

                        <option value="VDO">
                            Vân Đồn (VDO)
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="departure">
                        Ngày đi
                    </label>

                    <input
                        type="date"
                        id="departure"
                    >

                </div>


                <div
                    class="form-group"
                    id="returnGroup"
                >

                    <label for="returnDate">
                        Ngày về
                    </label>

                    <input
                        type="date"
                        id="returnDate"
                    >

                </div>


                <div class="form-group">

                    <label for="passengers">
                        Hành khách
                    </label>

                    <select id="passengers">

                        <option value="1">
                            1 hành khách
                        </option>

                        <option value="2">
                            2 hành khách
                        </option>

                        <option value="3">
                            3 hành khách
                        </option>

                        <option value="4">
                            4 hành khách
                        </option>

                        <option value="5">
                            5 hành khách
                        </option>

                        <option value="6">
                            6 hành khách
                        </option>

                        <option value="7">
                            7 hành khách
                        </option>

                        <option value="8">
                            8 hành khách
                        </option>

                        <option value="9">
                            9 hành khách
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="ticketClass">
                        Hạng vé
                    </label>

                    <select id="ticketClass">

                        <option value="economy">
                            Phổ thông
                        </option>

                        <option value="business">
                            Thương gia
                        </option>

                    </select>

                </div>

            </div>


            <div
                id="error"
                class="error"
            ></div>


            <button
                type="button"
                id="searchButton"
                class="search-button"
            >
                TÌM KIẾM CHUYẾN BAY
            </button>

        </section>


        <section class="result-section">

            <div class="result-header">

                <div>

                    <span class="eyebrow">
                        AVAILABLE FLIGHTS
                    </span>

                    <h2 id="resultTitle">
                        Chuyến bay
                    </h2>

                </div>

            </div>


            <div id="flightResults">

                <div class="empty-result">

                    <div class="empty-icon">
                        ✈
                    </div>

                    <h3>
                        Chưa có kết quả
                    </h3>

                    <p>
                        Hãy nhập thông tin chuyến bay để bắt đầu tìm kiếm.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 TripGo. All rights reserved.
            </p>

        </div>

    </footer>


    <script type="module" src="/src/js/search.js"></script>

</body>
</html>
